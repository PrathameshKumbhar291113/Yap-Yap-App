#Kotlin
kotlin.code.style=official
# Workaround for Kotlin/Native cross-module linkage with Compose libraries (CMP-7571)
kotlin.native.cacheKind=none
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
#Android
android.nonTransitiveRClass=true
# Debug builds local Yap-Yap backend (release uses production URL from shared/build.gradle.kts)
API_BASE_URL_ANDROID=http://10.0.2.2:8080/api
API_BASE_URL_IOS=http://localhost:8080/api
SOCKET_URL_ANDROID=http://10.0.2.2:8080
SOCKET_URL_IOS=http://localhost:8080
# Optional legacy override for both platforms: yapyap.baseUrl=http://192.168.1.x:8080
android.useAndroidX=true